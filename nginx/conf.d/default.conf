##############################################################################
# /etc/nginx/conf.d/default.conf
# Dev-mode server block  —  HTTP only (no TLS, all ports exposed)
# For production replace this file with a server block that listens on 443
# and redirects 80 → 443 using a Let's Encrypt or custom certificate.
##############################################################################

# ── HTTP: dev / plain access ─────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"           always;
    add_header X-Content-Type-Options   $x_content_type_options always;
    add_header X-XSS-Protection         "1; mode=block"        always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    # Uncomment and tighten CSP for production:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; ..." always;

    # ── Frontend ─────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # WebSocket / HMR support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
    }

    # ── Backend REST API ──────────────────────────────────────────────────────
    # Requests to /api/... are forwarded to the Express backend with the
    # /api prefix stripped so the backend sees /users, /auth/login, etc.
    location /api/ {
        # Rate limiting — burst allows short spikes while enforcing average
        limit_req zone=api_limit  burst=20  nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://backend;      # no trailing slash = keeps /api/ prefix
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Connection         "";

        # Return proper JSON error on rate-limit
        error_page 429 @too_many_requests;
    }

    # Auth sub-paths get a tighter rate limit (must come before /api/)
    location /api/auth/ {
        limit_req zone=auth_limit  burst=5  nodelay;

        proxy_pass http://backend;      # keeps /api/auth/ prefix
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Connection         "";
    }

    # ── Stream Proxy (live / VOD) ─────────────────────────────────────────────
    # /stream/<anything> → backend /proxy/<anything>
    # Long-lived connections; buffering must be OFF to avoid memory blow-up
    # and stalling HLS/MPEG-TS segments.
    location /stream/ {
        limit_req zone=stream_limit  burst=10  nodelay;

        proxy_pass http://backend/proxy/;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Connection         "";

        # ── Streaming-specific overrides ─────────────────────────────────
        proxy_buffering             off;    # pass bytes to client immediately
        proxy_cache                 off;    # never cache stream data
        proxy_request_buffering     off;    # do not buffer request body either

        proxy_read_timeout          3600s;  # keep alive for 1-hour streams
        proxy_send_timeout          3600s;

        # Force chunked transfer so the client receives data progressively
        chunked_transfer_encoding   on;

        # Disable gzip for streams — already compressed and CPU-intensive
        gzip off;

        # Allow large responses without limit
        proxy_max_temp_file_size    0;
    }

    # ── /proxy/ (alternative stream proxy path, mirrors /stream/) ────────────
    location /proxy/ {
        limit_req zone=stream_limit  burst=10  nodelay;

        proxy_pass http://backend/proxy/;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Connection         "";

        proxy_buffering             off;
        proxy_cache                 off;
        proxy_request_buffering     off;
        proxy_read_timeout          3600s;
        proxy_send_timeout          3600s;
        chunked_transfer_encoding   on;
        gzip off;
        proxy_max_temp_file_size    0;
    }

    # ── Static assets — long-lived cache ────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health check (no auth, no rate-limit) ────────────────────────────────
    location /health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Named error locations ────────────────────────────────────────────────
    location @too_many_requests {
        default_type application/json;
        return 429 '{"error":"Too many requests","message":"Rate limit exceeded. Please slow down."}';
    }

    # ── Custom error pages ───────────────────────────────────────────────────
    error_page 502 503 504 @upstream_error;
    location @upstream_error {
        default_type application/json;
        return 502 '{"error":"Service unavailable","message":"The server is temporarily unavailable."}';
    }
}

