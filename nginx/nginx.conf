##############################################################################
# /etc/nginx/nginx.conf  —  Production NGINX configuration
# IPTV Streaming Platform
##############################################################################

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

# Max open file descriptors per worker (raise on high-traffic servers)
worker_rlimit_nofile 65535;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    ##########################################################################
    # Basic settings
    ##########################################################################
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75s;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens      off;          # hide NGINX version

    client_max_body_size        50m;
    client_body_buffer_size     128k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 16k;

    ##########################################################################
    # Logging
    ##########################################################################
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    ##########################################################################
    # Rate limiting zones
    # (apply per real client IP — respects X-Forwarded-For via real_ip below)
    ##########################################################################
    # General API requests
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m      rate=60r/m;
    # Auth endpoints (login / refresh)
    limit_req_zone  $binary_remote_addr  zone=auth_limit:10m     rate=10r/m;
    # Stream URL generation
    limit_req_zone  $binary_remote_addr  zone=stream_limit:10m   rate=30r/m;

    limit_req_status  429;
    limit_conn_zone   $binary_remote_addr zone=conn_limit:10m;

    ##########################################################################
    # Real-IP (set to your load-balancer or CDN ranges)
    ##########################################################################
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    ##########################################################################
    # Gzip — enabled for text assets, explicitly OFF for streams
    ##########################################################################
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # Never gzip already-compressed or binary media types
    gzip_disable "msie6";

    ##########################################################################
    # Upstream pools
    ##########################################################################
    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend {
        server backend:3001;
        keepalive 64;
    }

    ##########################################################################
    # Shared proxy settings (included in location blocks via include or
    # repeated where needed)
    ##########################################################################
    proxy_http_version  1.1;
    proxy_connect_timeout   10s;
    proxy_send_timeout      60s;
    proxy_read_timeout      60s;
    proxy_buffer_size       4k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    ##########################################################################
    # Security headers map (value depends on whether the response is a
    # stream — streams must NOT have nosniff that blocks octet-stream)
    ##########################################################################
    map $uri $x_content_type_options {
        ~^/proxy/   "";                 # omit for stream proxy path
        default     "nosniff";
    }

    ##########################################################################
    # WebSocket upgrade map
    ##########################################################################
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       close;
    }

    ##########################################################################
    # Include virtual-host configs
    ##########################################################################
    include /etc/nginx/conf.d/*.conf;
}
